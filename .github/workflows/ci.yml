
name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew check-format

      - name: Build project
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test
