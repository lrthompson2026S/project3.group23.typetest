
name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            task: check-format
          - name: Build
            task: assemble
          - name: Tests
            task: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ${{ matrix.name }}
        run: ./gradlew ${{ matrix.task }}
