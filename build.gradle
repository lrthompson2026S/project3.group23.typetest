plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'project3.group23.typetest'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation files('lib/student.jar')
    implementation 'io.leego:banana:2.1.0'
    implementation 'org.jline:jline-terminal-ffm:4.4.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

application {
    mainClass = 'project3.group23.typetest.Main'
}

spotless {
    java {
        // Use custom Eclipse JDT formatting
        eclipse().configFile('config/java-formatter.properties')

        // Organize imports
        importOrder('java', 'javax', 'org', 'com', 'io', '')
        removeUnusedImports()

        // Clean whitespace
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('test', Test) {
    jvmArgs '-Djava.security.manager=allow'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.named('run') {
    dependsOn 'installDist'
    notCompatibleWithConfigurationCache('spawns a child process')
    actions.clear()

    def launcher = javaToolchains.launcherFor(java.toolchain)
    def installDir = tasks.named('installDist', Sync).map { it.destinationDir }
    def mainCls = application.mainClass

    doLast {
        def isWin = System.getProperty('os.name').toLowerCase().contains('win')
        def javaBin = launcher.get().executablePath.asFile.absolutePath
        def cp = new File(installDir.get(), 'lib').absolutePath + File.separator + '*'

        def cmd = [javaBin, '--enable-native-access=ALL-UNNAMED']
        if (isWin) cmd += ['-Dpause.on.exit=true']
        cmd += ['-cp', cp, mainCls.get()]
        cmd += (args ?: [])

        if (isWin) {
            // New console window gets a real console even when Gradle's JVM has none
            cmd = ['cmd', '/c', 'start', 'Type Test', '/wait'] + cmd
        }

        def startProcess = { boolean useTty ->
            def pb = new ProcessBuilder(cmd)
            if (useTty) {
                def tty = new File('/dev/tty')
                pb.redirectInput(ProcessBuilder.Redirect.from(tty))
                pb.redirectOutput(ProcessBuilder.Redirect.appendTo(tty))
                pb.redirectError(ProcessBuilder.Redirect.appendTo(tty))
            } else {
                pb.inheritIO()
            }
            return pb.start()
        }

        Process proc
        if (isWin) {
            proc = startProcess(false)
        } else {
            try {
                proc = startProcess(true)
            } catch (IOException e) {
                // No controlling terminal available; fall back to inherited stdio
                logger.warn("Could not attach to /dev/tty (${e.message}); using inherited stdio")
                proc = startProcess(false)
            }
        }

        def exit = proc.waitFor()
        if (exit != 0) throw new GradleException("Application exited with code ${exit}")
    }
}

tasks.register('format') {
    group = 'formatting'
    description = 'Formats all source code.'
    dependsOn 'spotlessApply'
}

tasks.register('check-format') {
    group = 'verification'
    description = 'Checks source code formatting.'
    dependsOn 'spotlessCheck'
}
