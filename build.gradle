plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'project3.group23.typetest'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation files('lib/student.jar')
    implementation 'io.leego:banana:2.1.0'
    implementation 'org.jline:jline:4.4.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

application {
    mainClass = 'project3.group23.typetest.Main'
}

spotless {
    java {
        // Use custom Eclipse JDT formatting
        eclipse().configFile('config/java-formatter.properties')

        // Organize imports
        importOrder('java', 'javax', 'org', 'com', 'io', '')
        removeUnusedImports()

        // Clean whitespace
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('test', Test) {
    jvmArgs '-Djava.security.manager=allow'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('run', JavaExec) {
    dependsOn 'installDist'
    notCompatibleWithConfigurationCache('spawns a child process')
    actions.clear()

    def launcher = javaToolchains.launcherFor(java.toolchain)
    def installDir = tasks.named('installDist', Sync).map { it.destinationDir }
    def mainCls = application.mainClass

    doLast {
        def osName = System.getProperty('os.name').toLowerCase()
        def isWin = osName.contains('win')
        def javaBin = launcher.get().executablePath.asFile.absolutePath
        def cp = new File(installDir.get(), 'lib').absolutePath + File.separator + '*'


        def cmd = [javaBin, '--enable-native-access=ALL-UNNAMED']

        // Forward Gradle's debugging configuration to the actual JVM
        if (debug) {
            cmd += [
                    '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=127.0.0.1:5005'
            ]
        }

        if (isWin) cmd += ['-Dpause.on.exit=true']
        cmd += ['-cp', cp, mainCls.get()]
        cmd += (args ?: [])

        def pb
        if (isWin) {
            // A new console window gets a real console even when Gradle's JVM has none
            pb = new ProcessBuilder(['cmd', '/c', 'start', 'Type Test', '/wait'] + cmd)
            pb.inheritIO()
        } else {
            // Gradle's forked build JVM has no controlling terminal, so walk up the
            // process tree and find an ancestor whose stdin is a real terminal device
            def findTty = {
                def ph = ProcessHandle.current()
                while (ph != null) {
                    try {
                        def target = java.nio.file.Files.readSymbolicLink(
                                new File("/proc/${ph.pid()}/fd/0").toPath()).toString()
                        if (target.startsWith('/dev/pts/') || target.startsWith('/dev/tty')) {
                            return new File(target)
                        }
                    } catch (Exception ignored) { }
                    ph = ph.parent().orElse(null)
                }
                return null
            }

            def tty = findTty()
            pb = new ProcessBuilder(cmd)
            if (tty != null) {
                pb.redirectInput(ProcessBuilder.Redirect.from(tty))
                pb.redirectOutput(ProcessBuilder.Redirect.appendTo(tty))
                pb.redirectError(ProcessBuilder.Redirect.appendTo(tty))
            } else {
                logger.warn('No terminal found in the parent processes; using inherited stdio')
                pb.inheritIO()
            }
        }

        def exit = pb.start().waitFor()
        if (exit != 0) throw new GradleException("Application exited with code ${exit}")
    }
}

tasks.register('format') {
    group = 'formatting'
    description = 'Formats all source code.'
    dependsOn 'spotlessApply'
}

tasks.register('check-format') {
    group = 'verification'
    description = 'Checks source code formatting.'
    dependsOn 'spotlessCheck'
}
