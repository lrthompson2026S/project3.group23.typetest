plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'project3.group23.typetest'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation files('lib/student.jar')
    implementation 'io.leego:banana:2.1.0'
    implementation 'org.jline:jline-terminal-ffm:4.4.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

application {
    mainClass = 'project3.group23.typetest.Main'
}

spotless {
    java {
        // Use custom Eclipse JDT formatting
        eclipse().configFile('config/java-formatter.properties')

        // Organize imports
        importOrder('java', 'javax', 'org', 'com', 'io', '')
        removeUnusedImports()

        // Clean whitespace
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('test', Test) {
    jvmArgs '-Djava.security.manager=allow'
}

tasks.named('run', JavaExec) {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    standardInput = System.in
}

tasks.register('format') {
    group = 'formatting'
    description = 'Formats all source code.'
    dependsOn 'spotlessApply'
}

tasks.register('check-format') {
    group = 'verification'
    description = 'Checks source code formatting.'
    dependsOn 'spotlessCheck'
}
